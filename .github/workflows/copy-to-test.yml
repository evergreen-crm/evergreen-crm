# Copy the live portal's database (structure + test data) into the TEST portal's database.
# Run it by hand: GitHub → Actions → "Copy live database to test" → Run workflow.
# Needs two repository secrets, added by an owner in Settings → Secrets and variables → Actions:
#   LIVE_DB_PASSWORD  the live project's database password  (Supabase → Project Settings → Database → Reset password)
#   TEST_DB_PASSWORD  the test project's database password  (evergreen-crm-test → same place)
# (LIVE_DB_URL / TEST_DB_URL full connection strings also work.)
# The test database is wiped and replaced each time. Scheduled jobs (cron) are not copied, and the copy turns off
# outgoing email and text messages in the test database, so the test portal never contacts real people.
name: Copy live database to test

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type COPY to wipe the test database and replace it with a copy of live'
        required: true

jobs:
  copy:
    if: ${{ github.event.inputs.confirm == 'COPY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_URL: ${{ secrets.LIVE_DB_URL }}
      TEST_URL: ${{ secrets.TEST_DB_URL }}
      LIVE_PW: ${{ secrets.LIVE_DB_PASSWORD }}
      TEST_PW: ${{ secrets.TEST_DB_PASSWORD }}
    steps:
      - name: Build the connection strings
        run: |
          enc() { python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          HOST=aws-0-ca-central-1.pooler.supabase.com:5432/postgres
          if [ -n "$LIVE_URL" ]; then LIVE="$LIVE_URL"; elif [ -n "$LIVE_PW" ]; then LIVE="postgresql://postgres.pstvuqzbehljlixqhwhw:$(enc "$LIVE_PW")@$HOST"; fi
          if [ -n "$TEST_URL" ]; then TEST="$TEST_URL"; elif [ -n "$TEST_PW" ]; then TEST="postgresql://postgres.swgvvjlxdtralgpvsnpu:$(enc "$TEST_PW")@$HOST"; fi
          test -n "$LIVE" || { echo "Add the LIVE_DB_PASSWORD secret first."; exit 1; }
          test -n "$TEST" || { echo "Add the TEST_DB_PASSWORD secret first."; exit 1; }
          case "$TEST" in *pstvuqzbehljlixqhwhw*) echo "The test connection points at the LIVE project. Stopping."; exit 1;; esac
          echo "::add-mask::$LIVE"; echo "::add-mask::$TEST"
          echo "LIVE=$LIVE" >> "$GITHUB_ENV"; echo "TEST=$TEST" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump live (roles, structure, data)
        run: |
          supabase db dump --db-url "$LIVE" -f roles.sql --role-only
          supabase db dump --db-url "$LIVE" -f schema.sql
          supabase db dump --db-url "$LIVE" -f data.sql --use-copy --data-only -x storage.buckets_vectors -x storage.vector_indexes -x storage.buckets_analytics -x supabase_migrations.schema_migrations
          ls -la *.sql

      - name: Wipe the test database's public schema
        run: |
          /usr/lib/postgresql/17/bin/psql "$TEST" -v ON_ERROR_STOP=1 -c "drop schema if exists public cascade; create schema public; grant usage on schema public to anon, authenticated, service_role; grant all on schema public to postgres, service_role;"
          /usr/lib/postgresql/17/bin/psql "$TEST" -v ON_ERROR_STOP=1 -c "truncate auth.users cascade;" || true

      - name: Restore into test
        run: |
          /usr/lib/postgresql/17/bin/psql "$TEST" --single-transaction -v ON_ERROR_STOP=1 \
            --file roles.sql --file schema.sql \
            --command 'SET session_replication_role = replica' --file data.sql 2>&1 | tail -40

      - name: Copy file-storage permissions
        run: |
          /usr/lib/postgresql/17/bin/psql "$LIVE" -At -v ON_ERROR_STOP=1 -c "select format('create policy %I on storage.objects as %s for %s to %s%s%s;', policyname, permissive, cmd, array_to_string(roles, ', '), case when qual is not null then ' using (' || qual || ')' else '' end, case when with_check is not null then ' with check (' || with_check || ')' else '' end) from pg_policies where schemaname='storage' and tablename='objects'" > storage_policies.sql
          { echo "set search_path = public, extensions, storage;"; echo "do \$\$ declare r record; begin for r in select policyname from pg_policies where schemaname='storage' and tablename='objects' loop execute format('drop policy %I on storage.objects', r.policyname); end loop; end \$\$;"; cat storage_policies.sql; } > storage_apply.sql
          /usr/lib/postgresql/17/bin/psql "$TEST" --single-transaction -v ON_ERROR_STOP=1 -f storage_apply.sql
          echo "Copied $(wc -l < storage_policies.sql) storage permissions."

      - name: Make the test copy safe
        run: |
          /usr/lib/postgresql/17/bin/psql "$TEST" -v ON_ERROR_STOP=0 <<'SQL'
          -- No scheduled jobs in the test copy.
          do $$ begin perform cron.unschedule(jobid) from cron.job; exception when others then null; end $$;
          -- Mark the database as the test copy (the portal shows a TEST banner when this is set).
          create table if not exists public.app_environment (id int primary key default 1 check (id = 1), name text not null);
          insert into public.app_environment (id, name) values (1, 'test') on conflict (id) do update set name = 'test';
          grant select on public.app_environment to anon, authenticated;
          SQL
          echo "Test database is ready."
